[package]
name = "native-agent-tui"
version = "0.1.0"
edition = "2021"
description = "A native terminal UI for observing and coordinating agent execution"
license = "MIT"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

