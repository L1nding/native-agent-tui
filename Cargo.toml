[package]
name = "native-agent-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A native terminal UI for observing and coordinating agent execution"
license = "MIT"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

