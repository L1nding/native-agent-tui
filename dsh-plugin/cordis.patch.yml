# The native agent TUI's bridge over dsh-base. Stdout belongs to the bridge's
# JSON-RPC frames; the terminal UI itself runs in the Rust process that
# launched this profile.

- insert:
    - id: zf-tui-bridge
      name: 'zf-tui-bridge'
      config:
        # Route for a new session until the user picks a model; a profile patch
        # can replace this row's config.
        provider: deepseek-official
        model: deepseek-v4-flash

    # dsh-base leaves the model's question tool to whoever can show a question.
    # The bridge answers `user-questions/request` through the TUI's request
    # panel, so this composition carries the tool.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
