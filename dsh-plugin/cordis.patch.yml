# The native agent TUI's bridge over dsh-base. Stdout belongs to the bridge's
# JSON-RPC frames; the terminal UI itself runs in the Rust process that
# launched this profile.

- insert:
    - id: zf-tui-bridge
      name: 'zf-tui-bridge'
      config:
        # Route for a new session until the user picks a model; a profile patch
        # can replace this row's config.
        provider: deepseek-official
        model: deepseek-v4-flash
